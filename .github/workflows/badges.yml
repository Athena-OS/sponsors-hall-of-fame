name: Badges

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  update-badges:
    name: Update Badges
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pandas Pillow
      - name: Get the Numbers
        run: |
          weekly=$(python generate.py --weekly)
          echo "Weekly value: '$weekly'"
          if [ -z "$weekly" ]; then echo "generate.py produced no output"; exit 1; fi
          echo "WEEKLY=$weekly" >> "$GITHUB_ENV"
      - name: Create Weekly-Badge
        uses: schneegans/dynamic-badges-action@master
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 2465ffe7d69897864623f96ddad57e5a
          filename: weekly.svg
          label: 💞 Receives
          message: $${{ env.WEEKLY }} / week
          valColorRange: ${{ env.WEEKLY }}
          maxColorRange: 50
          minColorRange: 0
